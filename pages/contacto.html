<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital</title>
</head>
<body>

    <!-- CABECERA -->
    <header>
        <h1 style="text-align: center;">Hospital PUCE</h1>
        <p style="text-align: center;">Descubre sobre los hospitales</p>
    </header>
   

    <!-- NAVEGACIÓN -->
    <nav>
        <a href="index.html">Home</a>
        <a href="pages/contacto.html">Contacto</a>
    </nav>
    <hr>

    <h2 style="text-align: center;">Emergencia</h2>
    <section>
        <p style="text-align: center;">
            si necesitas atención médica urgente, solicitar ayuda 
        </p>
        <div style="text-align: center;">
            <button type="button" onclick="alert"si tienes una emergencia médica, llama al 911 en Ecuador.¨)" >
                solicitar ayuda 
            </button>
        </div>
    </section>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="nombre">Ingrese su nombre</label>
        <br><br>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
        <br><br>

        <label for="email">Ingrese su email</label>
        <br><br>
        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
        <br><br>

        <label for="password">Ingrese su Dirección</label>
        <br><br>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
        <br><br>

        <label for="fecha_nacimiento">Ingrese su fecha de nacimiento</label>
        <br><br>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
        <br><br>

        <label for="telefono">Ingrese su teléfono</label>
        <br><br>
        <input type="tel" id="telefono" name="telefono" placeholder="Número">
        <br><br>

        <label for="cita">Fecha y hora de la cita</label>
        <br><br>
        <input type="datetime-local" id="cita" name="cita" min="2026-11-20T07:00" max="2027-12-31T18:00" required>
        <br><br>

        <span>Género</span>
        <br><br>
        <label for="masculino"><input type="radio" id="masculino" name="genero" value="masculino"> Masculino</label>
        <label for="femenino"><input type="radio" id="femenino" name="genero" value="femenino"> Femenino</label>
        <label for="otro"><input type="radio" id="otro" name="genero" value="otro"> Otro</label>
        <br><br>

        <label for="ciudad">Ciudad</label>
        <select name="ciudad" id="ciudad">
            <option value="" disabled selected>Seleccione una ciudad</option>
            <option value="latacunga">Latacunga</option>
            <option value="quito">Quito</option>
            <option value="cuenca">Cuenca</option>
            <option value="otro">Otro</option>
        </select>
        <br><br>

        <label for="seguro medico">Tiene seguro medico </label>
        <br><br>
        <textarea name="seguro medico" id="seguro medico" rows="4" cols="50" placeholder="si o no "></textarea>
        <br><br>

        <label for="foto">Adjuntar foto</label>
        <br><br>
        <input type="file" id="foto" name="foto" accept="image/*">
        <br><br>

        <!-- BOTONES -->
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
    
    <h2 style="text-align: center;">Estado del hospital</h2>
<div style="text-align: center;">
    <label for="camas">Ocupación de camas:</label>
    <meter id="camas" min="0" max="100" low="50" high="80" optimum="20" value="65">65%</meter>
    <strong>65%</strong>
</div>
<br>
</body>
</html>
